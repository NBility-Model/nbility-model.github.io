    taken.
- id: kwaliteitsmaatregel
  name: Kwaliteitsmaatregel
  name_en: Quality measure
  description: Een besluit over hoe fysieke netcomponenten worden aangepast om kwaliteitsknelpunten
    in het energienet te mitigeren.
