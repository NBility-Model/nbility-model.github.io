  <style>
    :root {
      --color: #000000;
      --thickness: 6;
      --c1: #a000ff;
      --c2: #6000ff;
      --c3: #1000ff;
    }
  </style>

  <defs>
    <style>
      @font-face {
        font-family: 'Google Sans Covo';
        font-style: normal;
        font-weight: normal;
        src: url(data:font/woff2;base64,) format('woff2');
      }
    </style>
  </defs>

  <!-- Lines/Back -->
  <g style="stroke-width:var(--thickness); stroke:var(--color);">
    <path d="M 64,16 V 64" />
    <path d="M 105.56922,88 64,64" />
    <path d="M 22.43078,88 64,64" />
  </g>

  <!-- Faces -->
  <g style="fill-opacity:0.5;">
    <path d="M 64,64 105.56922,40 64,16 22.43078,40 Z" fill="var(--c1)" />
    <path d="M 22.43078,40 V 88 L 64,112 V 64 Z"       fill="var(--c2)" />
    <path d="M 64,112 105.56922,88 V 40 L 64,64 Z"     fill="var(--c3)" />
  </g>

  <!-- Lines/Front -->
  <g style="stroke-width:var(--thickness); stroke:var(--color);">
    <path d="M 105.56922,40 64,64" />
    <path d="M 64,112 V 64" />
    <path d="M 22.43078,40 64,64" />
  </g>

  <!-- Hexagon -->
  <path d="M 64,16 L 105.56922,40 V 88 L 64,112 L 22.43078,88 V 40 Z" 
    style="stroke-width:var(--thickness); stroke:var(--color); fill:none;" />

  <!-- Circles -->
  <g style="fill:var(--color);">
    <circle r="10" cx="64"        cy="16"  />
    <circle r="10" cx="105.56922" cy="40"  />
    <circle r="10" cx="105.56922" cy="88"  />
    <circle r="10" cx="64"        cy="112" />
    <circle r="10" cx="22.43078"  cy="88"  />
    <circle r="10" cx="22.43078"  cy="40"  />
  </g>

  <!-- Text -->
  <text x="128" y="65" dominant-baseline="central" style="fill:var(--color);
    font-family:'Google Sans Covo'; font-size:80px; font-style:normal; font-weight:normal">
    COVO
  </text>
</svg>